name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      github.repository == 'ahervy/www' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Keep signature/author verification enabled. Never check out or run PR code.
      - name: Fetch verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable squash auto-merge for eligible patches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        with:
          script: |
            // Lint-only devDependencies; formatters and site/build tooling stay manual.
            const allowlist = new Set([
              '@eslint/js',
              '@typescript-eslint/eslint-plugin',
              '@typescript-eslint/parser',
              'eslint',
              'globals',
            ]);
            const dependencies = JSON.parse(process.env.DEPENDENCIES);
            const eligible = Array.isArray(dependencies) && dependencies.length > 0 &&
              dependencies.every((dependency) => {
                if (!dependency || !allowlist.has(dependency.dependencyName) ||
                    dependency.dependencyType !== 'direct:development' ||
                    dependency.updateType !== 'version-update:semver-patch' ||
                    dependency.packageEcosystem !== 'npm_and_yarn' ||
                    dependency.directory !== '/' || dependency.targetBranch !== 'main') {
                  return false;
                }
                // Reject missing/ambiguous versions, prereleases, and downgrades too.
                const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
                const previous = stable.exec(dependency.prevVersion);
                const next = stable.exec(dependency.newVersion);
                return previous !== null && next !== null &&
                  previous[1] === next[1] && previous[2] === next[2] &&
                  BigInt(next[3]) > BigInt(previous[3]);
              });
            if (!eligible) {
              core.info('Manual review: not every dependency is an allowlisted development patch.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            // fetch-metadata verifies the first commit; reject any additional commits.
            if (pr.commits !== 1 || pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.user.login !== 'dependabot[bot]' ||
                pr.head.repo?.full_name !== context.payload.repository.full_name ||
                pr.head.sha !== context.payload.pull_request.head.sha || pr.auto_merge) {
              core.info('Skipping stale, ineligible, or already queued PR.');
              return;
            }
            // Only queue auto-merge: GitHub enforces required checks and protections.
            await github.graphql(`
              mutation($id: ID!, $head: GitObjectID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $id, expectedHeadOid: $head, mergeMethod: SQUASH
                }) { pullRequest { number } }
              }
            `, { id: pr.node_id, head: pr.head.sha });
